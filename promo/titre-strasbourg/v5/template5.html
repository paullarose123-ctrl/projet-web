<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Titre Strasbourg v5</title>
<style>
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
svg{display:block}
#chunks{filter:drop-shadow(0 0 7px rgba(255,150,30,.75))}
</style></head><body>
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <mask id="titleMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><g id="maskG" fill="#fff"></g></mask>
</defs>
<g id="cam"><g id="shadows"></g><g id="fronts"></g><g id="chunks"></g>
 <g mask="url(#titleMask)"><rect id="glint" x="0" y="150" width="170" height="760" fill="url(#gl)" transform="skewX(-20)"/></g>
</g></svg>
<script>
const G=/*GLYPHS*/;
const NS='http://www.w3.org/2000/svg';
const mk=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||document.getElementById('svg')).appendChild(e);return e};
const clamp=x=>Math.max(0,Math.min(1,x));
const eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const eBack=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=(a,b)=>(((a+1)*73856093^(b+1)*19349663)>>>0)%1000/1000;
const sh=document.getElementById('shadows'),fr=document.getElementById('fronts'),chunksG=document.getElementById('chunks'),maskG=document.getElementById('maskG');
const defs=document.querySelector('defs');

const CFG={
 title:{K:12,dmax:13,sw:3.2,w:15,chunk:115,gap:38,spread:0.5,cdur:0.17,stag:0.045,fillAfter:0.78,chunkC:'#ffe45c',fill:'#ffd51a',shadowC:'#e8202c'},
 sub:{K:6,dmax:6,sw:2,w:7.5,chunk:50,gap:17,spread:0.4,cdur:0.14,stag:0.035,fillAfter:0.6,chunkC:'#fff6d8',fill:'#fff3c8',shadowC:'#e8202c'}
};
const FILL_DUR=0.34, SH_DELAY=0.22, SH_DUR=0.38, FADE_CHUNK=0.28;
const glyphs=[];
let gi=0;
['title','sub'].forEach(kind=>{
  const c=CFG[kind];
  G[kind].forEach((g,i)=>{
    const id=kind+i,[x1,y1,x2,y2]=g.bb;
    const cp=mk('clipPath',{id:'cp'+id,clipPathUnits:'userSpaceOnUse'},defs);
    const rect=mk('rect',{x:x1-20,width:x2-x1+40,y:y2+20,height:0},cp);
    const shadows=[];
    for(let k=c.K;k>=1;k--) shadows.push(mk('path',{d:g.d,fill:c.shadowC,stroke:c.shadowC,'stroke-width':c.sw,'stroke-linejoin':'round',opacity:0},sh));
    mk('path',{d:g.d,fill:c.fill,'clip-path':'url(#cp'+id+')'},fr);
    const edge=mk('path',{d:g.d,fill:'none',stroke:'#111','stroke-width':c.sw,'stroke-linejoin':'round','clip-path':'url(#cp'+id+')'},fr);
    if(kind==='title') mk('path',{d:g.d},maskG);
    // thick marker strokes with the pen lifted between them
    const tmp=mk('path',{d:g.d,fill:'none'},fr);
    const subs=g.d.split(/(?=M)/).filter(s=>s.trim());
    const chunks=[];
    subs.forEach((sd,si)=>{
      const sp=mk('path',{d:sd,fill:'none'},fr);const L=sp.getTotalLength();
      let pos=hash(gi,si)*(c.chunk+c.gap),cn=0;
      while(pos<L-6){
        const end=Math.min(pos+c.chunk*(0.8+0.4*hash(gi+cn,si+7)),L);
        const pts=[];for(let p=pos;p<end;p+=3){const q=sp.getPointAtLength(p);pts.push(q.x.toFixed(1)+' '+q.y.toFixed(1));}
        const q=sp.getPointAtLength(end);pts.push(q.x.toFixed(1)+' '+q.y.toFixed(1));
        if(pts.length>1){
          const path=mk('path',{d:'M'+pts.join('L'),fill:'none',stroke:c.chunkC,'stroke-width':c.w,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0},chunksG);
          const Lc=path.getTotalLength();path.setAttribute('stroke-dasharray',Lc+' '+(Lc+5));path.setAttribute('stroke-dashoffset',Lc);
          const blob=mk('circle',{cx:q.x,cy:q.y,r:0,fill:c.chunkC},chunksG);
          chunks.push({path,Lc,blob,delay:hash(gi*31+cn,si+3)*c.spread,br:c.w*(0.7+0.25*hash(gi+cn,si+11))});
        }
        pos=end+c.gap*(0.6+0.8*hash(gi+cn,si+5));cn++;
      }
      sp.remove();
    });
    tmp.remove();
    glyphs.push({kind,i,c,g,rect,shadows,chunks});
    gi++;
  });
});
const titleEnd=0.3+19*CFG.title.stag;
glyphs.forEach((o)=>{
  const c=o.c, base=o.kind==='title'?0.3:titleEnd+0.35;
  o.s=base+o.i*c.stag; o.fs=o.s+c.fillAfter; o.ss=o.fs+SH_DELAY;
});
const TD=Math.max(...glyphs.map(o=>o.ss+SH_DUR));
const GLINT_T=TD+0.1, GLINT_D=0.7, FADE_T=GLINT_T+GLINT_D+0.55;
window.TOTAL=FADE_T+0.65;
window.setT=function(t){
  document.getElementById('cam').setAttribute('transform','translate(960 540) scale('+(1+0.03*clamp(t/TOTAL))+') translate(-960 -540)');
  glyphs.forEach(o=>{
    const c=o.c;
    o.chunks.forEach(ch=>{
      const cs=o.s+ch.delay, u=clamp((t-cs)/c.cdur);
      const fade=1-clamp((t-o.fs-FILL_DUR*0.5)/FADE_CHUNK);
      ch.path.setAttribute('stroke-dashoffset',ch.Lc*(1-eOut(u)));
      ch.path.setAttribute('opacity',u>0?fade:0);
      const bu=clamp((t-cs-c.cdur*0.75)/0.2);
      ch.blob.setAttribute('r',bu>0?ch.br*eBack(bu)*fade:0);
    });
    const pf=eOut(clamp((t-o.fs)/FILL_DUR)), bb=o.g.bb, H=(bb[3]-bb[1])+40;
    o.rect.setAttribute('y',bb[3]+20-H*pf);o.rect.setAttribute('height',H*pf);
    const ps=eOut(clamp((t-o.ss)/SH_DUR));
    o.shadows.forEach((p,j)=>{
      const k=c.K-j, dd=c.dmax*ps*k/c.K;
      p.setAttribute('transform','translate('+dd+' '+dd+')');
      p.setAttribute('opacity',clamp(ps*6));
    });
  });
  document.getElementById('glint').setAttribute('x',lerp(250,2300,eIO(clamp((t-GLINT_T)/GLINT_D))));
  document.getElementById('svg').style.opacity=1-clamp((t-FADE_T)/0.55);
};
setT(0);
</script></body></html>
