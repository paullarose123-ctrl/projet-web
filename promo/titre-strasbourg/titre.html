<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Titre Strasbourg</title>
<style>
@font-face{font-family:Caprasimo;src:url(caprasimo.ttf)}
@font-face{font-family:Montserrat;src:url(montserrat.ttf);font-weight:500}
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#title{position:relative;font-family:Caprasimo,serif;font-size:230px;line-height:1.02;text-align:center;white-space:nowrap}
.line{position:relative;display:block;height:1.02em}
.layer{position:absolute;inset:0;display:block;text-align:center}
.l{display:inline-block;white-space:pre}
.shadow .l{color:#e8202c;-webkit-text-stroke:7px #e8202c}
.front .l{color:#ffd51a;-webkit-text-stroke:3px #111;paint-order:stroke fill}
#sub{margin-top:70px;display:flex;align-items:center;gap:36px;font-family:Montserrat,sans-serif;font-weight:500;font-size:56px;color:#f4ead0;text-transform:uppercase;white-space:nowrap}
#sub .bar{height:4px;background:#ffd51a;width:0}
#sub .txt{letter-spacing:.3em;margin-right:-.3em}
</style></head><body>
<div id="stage"><div id="title"></div>
<div id="sub"><div class="bar" id="b1"></div><div class="txt" id="st">Musée zoologique</div><div class="bar" id="b2"></div></div></div>
<script>
const lines=["Une visite","à Strasbourg"];
const T=document.getElementById('title');
const items=[];let idx=0;
lines.forEach(txt=>{
  const line=document.createElement('div');line.className='line';
  ['shadow','front'].forEach(k=>{
    const lay=document.createElement('div');lay.className='layer '+k;
    [...txt].forEach((c,i)=>{const s=document.createElement('span');s.className='l';s.textContent=c;lay.appendChild(s);
      if(k==='front')items.push({s,i:idx++});else items[idx-1+0]&&0;});
    line.appendChild(lay);
  });
  // placeholder keeps width
  const ph=document.createElement('span');ph.style.visibility='hidden';ph.textContent=txt;ph.className='l';line.appendChild(ph);
  T.appendChild(line);
});
// collect per-letter elements by layer in order
const front=[...document.querySelectorAll('.front .l')],shadow=[...document.querySelectorAll('.shadow .l')];
const N=front.length;
const clamp=x=>Math.max(0,Math.min(1,x));
const easeOut=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const START=0.5,STAG=0.1,DUR=0.7;
const SUB=2.9;
window.setT=function(t){
  for(let i=0;i<N;i++){
    const p=clamp((t-START-i*STAG)/DUR);
    const e=back(p),o=easeOut(clamp(p*1.6));
    const sc=0.55+0.45*e, ty=(1-e)*60;
    const f=front[i];
    f.style.opacity=o;f.style.transform=`translateY(${ty}px) scale(${sc})`;f.style.filter=`blur(${(1-o)*14}px)`;
    // red shadow extrudes after the letter lands
    const q=clamp((t-START-i*STAG-0.25)/0.5), se=easeOut(q), d=11*se;
    const s=shadow[i];
    s.style.opacity=o*clamp(q*3);
    s.style.transform=`translate(${d}px,${d}px) translateY(${ty}px) scale(${sc})`;
    s.style.filter=`blur(${(1-o)*14}px)`;
  }
  const a=easeOut(clamp((t-SUB)/0.9));
  const st=document.getElementById('st');
  st.style.opacity=a;st.style.letterSpacing=(0.55-0.25*a)+'em';st.style.marginRight=(-(0.55-0.25*a))+'em';
  const w=easeOut(clamp((t-SUB-0.2)/0.9))*150;
  b1.style.width=b2.style.width=w+'px';b1.style.opacity=b2.style.opacity=clamp(w/20);
  const fade=1-clamp((t-6.6)/0.6);
  document.getElementById('stage').style.opacity=fade;
};
setT(0);
</script></body></html>
